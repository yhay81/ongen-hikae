name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.18.0
          cache: true
      - run: vp install --frozen-lockfile
      - run: npm run release:check
      - run: npm run check
      - run: npm test
      - run: npm run build
